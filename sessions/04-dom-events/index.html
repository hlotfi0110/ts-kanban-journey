<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="بورد مدیریت پروژه کانبان با طراحی مدرن و شیشه‌ای - ساخته شده با TypeScript">
  <meta name="theme-color" content="#0a0a1a">
  
  <title>✨ بورد مدیریت تسک | Kanban Aurora</title>
  
  <!-- 🎨 فونت وزیرمتن (Variable Font) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <!-- 🌌 پس‌زمینه Aurora با orb‌های شناور -->
  <div class="aurora-bg" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
    <div class="noise-overlay"></div>
  </div>

  <div id="app" class="app-container">
    <!-- 🔝 هدر اصلی با افکت شیشه‌ای -->
    <header class="board-header glass-panel">
      <div class="header-content">
        <div class="logo-group">
          <div class="logo-glow"></div>
          <h1 class="logo-title">
            <span class="logo-icon">✨</span>
            <span>بورد کانبان</span>
          </h1>
          <p class="logo-subtitle">مدیریت هوشمند تسک‌ها با TypeScript</p>
        </div>
        
        <div class="header-actions">
          <!-- 🌙 دکمه تغییر تم -->
          <button id="themeToggle" class="icon-btn glass-btn" aria-label="تغییر تم">
            <span class="theme-icon">🌙</span>
          </button>
        </div>
      </div>

      <!-- 📊 آمار زنده با کارت‌های شیشه‌ای -->
      <div class="stats-grid">
        <div class="stat-card glass-card stat-total">
          <div class="stat-icon">📋</div>
          <div class="stat-content">
            <span class="stat-label">تعداد کل تسک‌ها</span>
            <span class="stat-value" id="totalTasks">۰</span>
          </div>
          <div class="stat-glow"></div>
        </div>
        
        <div class="stat-card glass-card stat-progress">
          <div class="stat-icon">📈</div>
          <div class="stat-content">
            <span class="stat-label">پیشرفت پروژه</span>
            <span class="stat-value" id="progress">۰٪</span>
          </div>
          <div class="stat-glow"></div>
        </div>
        
        <div class="stat-card glass-card stat-todo">
          <div class="stat-icon">📝</div>
          <div class="stat-content">
            <span class="stat-label">در انتظار انجام</span>
            <span class="stat-value" id="todoCount">۰</span>
          </div>
        </div>
        
        <div class="stat-card glass-card stat-done">
          <div class="stat-icon">✅</div>
          <div class="stat-content">
            <span class="stat-label">تکمیل شده</span>
            <span class="stat-value" id="doneCount">۰</span>
          </div>
        </div>
      </div>
    </header>

    <!-- ➕ فرم افزودن تسک جدید -->
    <section class="add-task-section glass-panel floating-panel">
      <form id="addTaskForm" class="add-task-form" autocomplete="off">
        <div class="form-header">
          <span class="form-icon">➕</span>
          <h2>افزودن تسک جدید</h2>
        </div>
        
        <div class="form-grid">
          <div class="input-group input-title">
            <label for="taskTitle">عنوان تسک</label>
            <input 
              type="text" 
              id="taskTitle" 
              name="title"
              placeholder="مثال: طراحی صفحه فرود..."
              required
              maxlength="100"
            >
          </div>
          
          <div class="input-group input-priority">
            <label for="taskPriority">اولویت</label>
            <select id="taskPriority" name="priority">
              <option value="LOW">🟢 اولویت کم</option>
              <option value="MEDIUM" selected>🟡 اولویت متوسط</option>
              <option value="HIGH">🔴 اولویت زیاد</option>
            </select>
          </div>
          
          <button type="submit" id="addTaskBtn" class="submit-btn glow-btn">
            <span class="btn-icon">✨</span>
            <span>ثبت تسک جدید</span>
            <span class="btn-shine"></span>
          </button>
        </div>
      </form>
    </section>

    <!-- 🎯 ناحیه ستون‌های کانبان (Bento Grid) -->
    <section class="board-section">
      <div class="board-columns bento-grid" id="boardColumns">
        <!-- ستون‌ها به صورت داینامیک رندر می‌شوند -->
      </div>
    </section>

    <!-- 📌 پاورفوتر -->
    <footer class="app-footer glass-panel">
      <p>
        ساخته شده با <span class="heart">❤️</span> و 
        <span class="brand">TypeScript</span> | 
        دوره آموزشگاه علم‌آوران نوین
      </p>
    </footer>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
